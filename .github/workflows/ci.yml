name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # .ipa de Release sin firmar, para firmarlo e instalarlo con Sideloadly.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Elegir Xcode 26 (SDK con Liquid Glass)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Usando $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Compilar Release para iPhone (sin firmar)
        run: |
          set +e
          xcodebuild build \
            -project Cadiva.xcodeproj -scheme Cadiva -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ipa.log 2>&1
          STATUS=$?
          grep -E "error:|BUILD" ipa.log
          exit $STATUS

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cadiva.app Payload/
          zip -qry Cadiva.ipa Payload
          ls -lh Cadiva.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Cadiva-ipa
          path: Cadiva.ipa

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Elegir Xcode 26 (SDK con Liquid Glass)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Usando $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Pruebas de CadivaCore (swift test)
        working-directory: CadivaCore
        run: swift test -Xswiftc -warnings-as-errors

      - name: Elegir simulador
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ver = lambda rt: [int(x) for x in rt.split("iOS-")[-1].split("-") if x.isdigit()]
          rts = sorted((rt for rt in data if "iOS" in rt and data[rt]), key=ver, reverse=True)
          devs = data[rts[0]]
          pick = next((d for n in ("iPhone 17", "iPhone 16") for d in devs if d["name"] == n), None) or next(d for d in devs if d["name"].startswith("iPhone"))
          print(pick["udid"])
          ')
          echo "udid=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$ID"

      - name: Compilar la app (advertencias como errores)
        run: |
          set +e
          xcodebuild build \
            -project Cadiva.xcodeproj -scheme Cadiva -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            > build.log 2>&1
          STATUS=$?
          grep -E "(error|warning):|BUILD" build.log
          test $STATUS -eq 0 || exit $STATUS
          if grep -E "/(Cadiva|CadivaCore)/.*: warning:" build.log; then
            echo "::error::Hay advertencias en el código de Cadiva"; exit 1
          fi

      - name: Pruebas en simulador (xcodebuild test)
        run: |
          set +e
          xcodebuild test \
            -project Cadiva.xcodeproj -scheme Cadiva \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1
          STATUS=$?
          grep -E "error:|✔|✘|passed|failed|TEST" test.log
          exit $STATUS

      - name: Capturas (claro, oscuro, XXL y accesibilidad)
        run: |
          ID="${{ steps.sim.outputs.udid }}"
          APP=build/Build/Products/Debug-iphonesimulator/Cadiva.app
          mkdir -p capturas
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl status_bar "$ID" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$ID" "$APP"
          capturar() { # nombre apariencia tamaño argumentos...
            local nombre=$1 apariencia=$2 tamano=$3; shift 3
            xcrun simctl ui "$ID" appearance "$apariencia"
            xcrun simctl ui "$ID" content_size "$tamano"
            xcrun simctl launch --terminate-running-process "$ID" com.cadiva.app --datos-ejemplo "$@" > /dev/null
            sleep ${ESPERA:-4}
            xcrun simctl io "$ID" screenshot "capturas/$nombre.png" > /dev/null
          }
          for apariencia in light dark; do
            capturar "productos-$apariencia" $apariencia large
            capturar "detalle-$apariencia" $apariencia large --pantalla detalle
            capturar "registro-$apariencia" $apariencia large --pantalla registro
            capturar "nuevo-producto-$apariencia" $apariencia large --pantalla nuevo-producto
            capturar "gasto-$apariencia" $apariencia large --pestana 1
            capturar "ajustes-$apariencia" $apariencia large --pestana 2
            capturar "borrado-$apariencia" $apariencia large --pestana 2 --pantalla borrado
            capturar "productos-$apariencia-xxl" $apariencia extra-extra-large
            capturar "detalle-$apariencia-xxl" $apariencia extra-extra-large --pantalla detalle
          done
          for apariencia in light dark; do
            capturar "cuenta-arranque-$apariencia" $apariencia large --pantalla arranque
            capturar "cuenta-login-$apariencia" $apariencia large --pantalla login
            capturar "cuenta-registro-$apariencia" $apariencia large --pantalla registro-cuenta
            capturar "cuenta-recuperar-$apariencia" $apariencia large --pantalla recuperar
            capturar "cuenta-bloqueo-$apariencia" $apariencia large --pantalla bloqueo
            capturar "cuenta-cargando-$apariencia" $apariencia large --pantalla cargando
            capturar "cuenta-crear-pin-$apariencia" $apariencia large --pestana 2 --pantalla crear-pin
            capturar "cuenta-oferta-$apariencia" $apariencia large --pantalla oferta
          done
          ESPERA=1.3 capturar "cuenta-arranque-trazando" light large --pantalla arranque
          ESPERA=1.9 capturar "cuenta-arranque-cruzando" light large --pantalla arranque
          capturar "cuenta-login-light-ax5" light accessibility-extra-extra-extra-large --pantalla login
          capturar "cuenta-bloqueo-light-ax5" light accessibility-extra-extra-extra-large --pantalla bloqueo
          capturar "productos-light-ax5" light accessibility-extra-extra-extra-large
          capturar "detalle-light-ax5" light accessibility-extra-extra-extra-large --pantalla detalle
          capturar "registro-light-ax5" light accessibility-extra-extra-extra-large --pantalla registro
          capturar "gasto-light-ax5" light accessibility-extra-extra-extra-large --pestana 1
          ls capturas

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas
          path: capturas
          if-no-files-found: ignore

      - name: Subir registros
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
